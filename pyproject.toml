[project]
name = "axms-mcp-server"
version = "0.1.0"
description = "AX Module Studio shared MCP transport and tool catalog boundary"
readme = "README.md"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "mcp==2.1.1",
  "uvicorn>=0.35,<0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axms_mcp_server"]

[tool.uv]
package = false

[tool.unittest]
start-directory = "tests"
